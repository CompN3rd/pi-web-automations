name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Verify both supported platforms and the minimum runtime SQLite release.
        os: [ubuntu-latest, windows-2022]
        node: [22.19.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use the declared npm version
        # Node 22's bundled npm 10 crashes (edgesOut) on the minimum-peer reinstall.
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Verify and validate package artifact
        run: npm run verify

      - name: Inspect dry-run package manifest
        run: npm run pack:dry

      - name: Install minimum supported host peers
        # Exercise the minimum host pair without changing metadata or the lockfile.
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0 @jmfederico/pi-web@1.202610.9

      - name: Verify minimum supported host peers
        run: npm run verify
