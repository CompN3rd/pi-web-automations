name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Windows to the VS 2022 image so node-gyp can compile native
        # dependencies when a prebuild is unavailable (notably Node 22).
        os: [ubuntu-latest, windows-2022]
        node: [22.19.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and validate package artifact
        run: npm run verify

      - name: Inspect dry-run package manifest
        run: npm run pack:dry

      - name: Install minimum supported host peers
        # Exercise the minimum host pair without changing metadata or the lockfile.
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.0 @jmfederico/pi-web@1.202610.3

      - name: Verify minimum supported host peers
        run: npm run verify
