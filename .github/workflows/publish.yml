name: Publish npm release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    if: github.repository == 'CompN3rd/pi-web-automations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require matching stable tag on main history
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) throw new Error('Run only on a stable v<package-version> tag');
          if (pkg.name !== '@compn3rd/pi-web-automations' || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) throw new Error('Package/lock mismatch');
          if (pkg.repository?.url !== 'git+https://github.com/CompN3rd/pi-web-automations.git') throw new Error('Unexpected repository');
          NODE
          git merge-base --is-ancestor HEAD origin/main

  checks:
    needs: release-ref
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Pack verified build once
        id: packed
        run: |
          set -euo pipefail
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          packages=(release/*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          echo "filename=$(basename "${packages[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Validate isolated tarball publication shape (not authorization)
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          cp -R release "$sandbox/release"
          cd "$sandbox"
          npm publish ./release/*.tgz --dry-run --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      filename: ${{ steps.packed.outputs.filename }}
      sha256: ${{ steps.packed.outputs.sha256 }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require OIDC-capable npm
        run: |
          NPM_VERSION="$(npm --version)" node -e 'const [a,b,c] = process.env.NPM_VERSION.split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) throw new Error("npm >=11.5.1 required")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Recheck and publish exact verified tarball using OIDC only
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          TARBALL: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  release/$TARBALL" | sha256sum --check --strict
          tar -xOf "release/$TARBALL" package/package.json | node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            if (pkg.name !== "@compn3rd/pi-web-automations" || !/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) throw new Error("Unexpected artifact name/version");
            if (pkg.repository?.url !== "git+https://github.com/CompN3rd/pi-web-automations.git") throw new Error("Unexpected artifact repository");
          '
          # Never fall back to token authentication or execute package lifecycle scripts.
          test -z "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}${NPM_ID_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm publish "./release/$TARBALL" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
          echo 'Published via npm trusted publishing. Verify public version, integrity and provenance before creating the GitHub release.' >> "$GITHUB_STEP_SUMMARY"
